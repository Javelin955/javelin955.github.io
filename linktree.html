<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon de l'Imaginaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
@font-face {
    font-family: "MVBoli";
    src: url("font/mvboli.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
    --maincolor : #b15996 ;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
    color:white;
}

/* Fond flouté */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:url("Affiche_sans_details.png") center center/cover no-repeat;
    filter:blur(8px);
    transform:scale(1.1);
    z-index:-2;
}

/* Assombrissement */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:-1;
}

.container{
    width:90%;
    max-width:500px;
    text-align:center;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

.logo{
    width:140px;
    height:140px;
    object-fit:contain;
    margin-bottom:15px;
}

h1{
    font-size:2rem;
    margin-bottom:10px;
    font-family: 'MVBoli', sans-serif;
}

.subtitle{
    margin-bottom:30px;
    opacity:.85;
}

.links{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.link{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 22px;

    text-decoration:none;
    color: var(--maincolor);

    background:rgba(255, 255, 255, 0.70);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:18px;

    backdrop-filter:blur(10px);

    transition:all .3s ease;
}

.link:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,0.20);
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.link-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.link svg{
    width:24px;
    height:24px;
    fill:var(--maincolor);
    flex-shrink:0;
}

.link span{
    font-weight:600;
}

.arrow{
    font-size:1.5rem;
    opacity:.7;
    transition:.3s;
}

.link:hover .arrow{
    transform:translateX(5px);
    opacity:1;
}

.footer{
    margin-top:25px;
    font-size:0.85rem;
    opacity:.7;
}

@media (max-width: 600px){

    body{
        align-items:flex-start;
        padding:20px 10px;
        overflow-y:auto;
    }

    .container{
        width:100%;
        max-width:100%;
        padding:25px 20px;
        border-radius:20px;
    }

    .logo{
        width:90px;
        height:90px;
        margin-bottom:8px;
    }

    h1{
        font-size:2.3rem;
        margin-bottom:5px;
        line-height:1.1;
    }

    .subtitle{
        font-size:1rem;
        margin-bottom:20px;
        line-height:1.4;
    }

    .links{
        gap:12px;
    }

    .link{
        padding:15px 18px;
        border-radius:15px;
    }

    .link-left{
        gap:12px;
    }

    .link svg{
        width:22px;
        height:22px;
    }

    .link span{
        font-size:1rem;
    }

    .arrow{
        font-size:1.3rem;
    }

    .footer{
        margin-top:20px;
        font-size:0.75rem;
    }


    @media (max-width: 480px){

    body{
        align-items:flex-start;
        padding:15px 8px;
        overflow-y:auto;
    }

    .container{
        padding:20px 15px;
    }

    .logo{
        width:80px;
        height:80px;
    }

    h1{
        font-size:2rem;
    }

    .subtitle{
        font-size:0.95rem;
        margin-bottom:18px;
    }

    .link{
        padding:14px 16px;
    }

    .link span{
        font-size:0.95rem;
    }

    .link svg{
        width:20px;
        height:20px;
    }

}
}
</style>

</head>
